name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: python -m pip install openai
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run test:contract
        env:
          REQUIRE_PYTHON_CONTRACT: "1"

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: ./scripts/install-linux-build-deps.sh
      - run: npm ci
      - run: python -m pip install openai
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run test:contract
        env:
          REQUIRE_PYTHON_CONTRACT: "1"
      - run: ./scripts/test-headless.sh

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: python -m pip install openai
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: ./scripts/test-contracts.sh
        env:
          REQUIRE_PYTHON_CONTRACT: "1"
      - run: ./scripts/test-headless.sh
