name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install cmake
      - run: npm ci
      - name: Verify bundle icons
        working-directory: src-tauri
        run: |
          ls -la icons
          for f in icons/icon.icns icons/icon.png icons/32x32.png icons/128x128.png icons/icon.ico; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: ./scripts/build-sidecars.sh
      - run: ./scripts/prepare-flux-vendor.sh
      - run: ./scripts/prepare-kokoro-vendor.sh
      - run: ./scripts/test-sidecar-stubs.sh
      - run: ./scripts/check-linux-packaging.sh
      - run: ./scripts/check-windows-packaging.sh
      - name: Configure Apple signing
        env:
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$APPLE_SIGNING_IDENTITY_SECRET" == "Developer ID Application"* ]]; then
            echo "Using Developer ID for a signed, notarized release"
            {
              echo "APPLE_SIGNED=true"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET"
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
              echo "APPLE_PASSWORD<<ENDOFPASSWORD"
              echo "$APPLE_PASSWORD_SECRET"
              echo "ENDOFPASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No Developer ID Application certificate configured; building unsigned"
            echo "APPLE_SIGNED=false" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - name: Import Apple signing certificate
        if: env.APPLE_SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Local AI Router ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles dmg,app

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/install-linux-build-deps.sh
      - run: npm ci
      - name: Verify bundle icons
        working-directory: src-tauri
        run: |
          for f in icons/icon.png icons/32x32.png icons/128x128.png icons/icon.ico; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc","cudart","cudart_dev","cublas","cublas_dev"]'
          use-github-cache: false
      - name: Build GGUF sidecars (CPU, CUDA, Vulkan)
        run: BUILD_LLAMA_CUDA=1 BUILD_LLAMA_VULKAN=1 ./scripts/build-sidecars.sh
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Local AI Router ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - run: ./scripts/package-linux-headless.sh
      - name: Verify Linux artifacts
        run: |
          ls -la src-tauri/target/release/bundle/deb/*.deb
          ls -la src-tauri/target/release/bundle/appimage/*.AppImage
          test -s src-tauri/target/release/local-ai-router-linux-headless.tar.gz
          src-tauri/target/release/local-ai-router serve --help | grep -q -- "--secrets-file"
          tar -tzf src-tauri/target/release/local-ai-router-linux-headless.tar.gz | grep -q local-ai-router.service
          tar -tzf src-tauri/target/release/local-ai-router-linux-headless.tar.gz | grep -q '/ui/index.html'
          tar -tzf src-tauri/target/release/local-ai-router-linux-headless.tar.gz | grep -q llama-server-
          tar -tzf src-tauri/target/release/local-ai-router-linux-headless.tar.gz | grep -q llama-server-cuda-
          tar -tzf src-tauri/target/release/local-ai-router-linux-headless.tar.gz | grep -q llama-server-vulkan-
          dpkg-deb -c src-tauri/target/release/bundle/deb/*.deb | grep -E 'ui/index.html'
          dpkg-deb -c src-tauri/target/release/bundle/deb/*.deb | grep -E 'llama-server-'
          dpkg-deb -c src-tauri/target/release/bundle/deb/*.deb | grep -E 'local-ai-router.service'
          ./scripts/check-linux-packaging.sh
      - name: Attach headless archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/local-ai-router-linux-headless.tar.gz \
            --clobber

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Verify bundle icons
        working-directory: src-tauri
        run: |
          for f in icons/icon.png icons/32x32.png icons/128x128.png icons/icon.ico; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ver = "1.3.296.0"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          $exe = Join-Path $env:RUNNER_TEMP 'VulkanSDK-Installer.exe'
          curl.exe -L --fail -o $exe $url
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
            '--accept-licenses','--default-answer','--confirm-command','install'
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited $($p.ExitCode)" }
          $sdk = "C:\VulkanSDK\$ver"
          "VULKAN_SDK=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - uses: Jimver/cuda-toolkit@v0.2.35
        id: cuda-toolkit
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc","cudart","cudart_dev","cublas","cublas_dev"]'
          use-github-cache: false
      - name: Build GGUF sidecars (CPU, CUDA, and Vulkan)
        run: BUILD_LLAMA_CUDA=1 BUILD_LLAMA_VULKAN=1 ./scripts/build-sidecars.sh
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Local AI Router ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
      - run: ./scripts/package-windows-headless.sh
      - name: Verify Windows artifacts
        run: |
          ls -la src-tauri/target/release/bundle/nsis/*.exe
          test -s src-tauri/target/release/local-ai-router-windows-headless.zip
          src-tauri/target/release/local-ai-router.exe serve --help | grep -q -- "--secrets-file"
          tar -tf src-tauri/target/release/local-ai-router-windows-headless.zip | grep -q 'ui/index.html'
          tar -tf src-tauri/target/release/local-ai-router-windows-headless.zip | grep -q llama-server-
          tar -tf src-tauri/target/release/local-ai-router-windows-headless.zip | grep -q local-ai-router.exe
          tar -tf src-tauri/target/release/local-ai-router-windows-headless.zip | grep -q README.txt
          ./scripts/check-windows-packaging.sh
      - name: Attach headless archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/local-ai-router-windows-headless.zip \
            --clobber
