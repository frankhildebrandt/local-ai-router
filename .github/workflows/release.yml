name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install cmake
      - run: npm ci
      - name: Verify bundle icons
        working-directory: src-tauri
        run: |
          ls -la icons
          for f in icons/icon.icns icons/icon.png icons/32x32.png icons/128x128.png icons/icon.ico; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - run: xcodebuild -downloadComponent MetalToolchain
      - run: ./scripts/build-sidecars.sh
      - name: Configure Apple signing
        env:
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$APPLE_SIGNING_IDENTITY_SECRET" == "Developer ID Application"* ]]; then
            echo "Using Developer ID for a signed, notarized release"
            {
              echo "APPLE_SIGNED=true"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY_SECRET"
              echo "APPLE_ID=$APPLE_ID_SECRET"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID_SECRET"
              echo "APPLE_PASSWORD<<ENDOFPASSWORD"
              echo "$APPLE_PASSWORD_SECRET"
              echo "ENDOFPASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No Developer ID Application certificate configured; building unsigned"
            echo "APPLE_SIGNED=false" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi
      - name: Import Apple signing certificate
        if: env.APPLE_SIGNED == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p actions "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p actions "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Local AI Router ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles dmg,app

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/install-linux-build-deps.sh
      - run: npm ci
      - name: Verify bundle icons
        working-directory: src-tauri
        run: |
          for f in icons/icon.png icons/32x32.png icons/128x128.png icons/icon.ico; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - uses: Jimver/cuda-toolkit@v0.2.16
        id: cuda-toolkit
        with:
          cuda: "12.4.0"
          method: network
      - name: Build GGUF sidecars (CPU, CUDA, Vulkan)
        run: BUILD_LLAMA_CUDA=1 BUILD_LLAMA_VULKAN=1 ./scripts/build-sidecars.sh
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Local AI Router ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: --bundles deb,appimage --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - run: ./scripts/package-linux-headless.sh
      - name: Attach headless archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/local-ai-router-linux-headless.tar.gz \
            --clobber

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Verify bundle icons
        working-directory: src-tauri
        run: |
          for f in icons/icon.png icons/32x32.png icons/128x128.png icons/icon.ico; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Install Vulkan SDK
        run: |
          curl -L -o "$RUNNER_TEMP/vulkan-sdk.exe" "https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe"
          "$RUNNER_TEMP/vulkan-sdk.exe" --accept-eula --quiet
          echo "VULKAN_SDK=C:/VulkanSDK/1.3.296.0" >> "$GITHUB_ENV"
          echo "C:/VulkanSDK/1.3.296.0/Bin" >> "$GITHUB_PATH"
      - uses: Jimver/cuda-toolkit@v0.2.16
        with:
          cuda: "12.4.0"
          method: network
      - name: Build GGUF sidecars (CPU, CUDA, and Vulkan)
        run: BUILD_LLAMA_CUDA=1 BUILD_LLAMA_VULKAN=1 ./scripts/build-sidecars.sh
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Local AI Router ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          args: --bundles nsis
      - run: ./scripts/package-windows-headless.sh
      - name: Attach headless archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/local-ai-router-windows-headless.zip \
            --clobber
